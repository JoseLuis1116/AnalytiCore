[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/test_health_and_schemas.py" = ["I001", "E402"]