name: Python CI

on:
  push:
    branches:
      - main
    paths:
      - "python-service/**"
      - ".github/workflows/python-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "python-service/**"
      - ".github/workflows/python-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Ruff and Pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: python-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python-service/requirements.txt
            python-service/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check app tests

      - name: Run Pytest
        run: python -m pytest -v