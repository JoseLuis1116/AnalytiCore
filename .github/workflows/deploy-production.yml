name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      service:
        description: Servicio que se desplegará en Production
        required: true
        default: all
        type: choice
        options:
          - java
          - python
          - frontend
          - all

permissions:
  contents: read

concurrency:
  group: analyticore-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Tests, Docker build and security
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # FRONTEND
      # =========================================================

      - name: Configure Node.js
        if: inputs.service == 'frontend' || inputs.service == 'all'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: inputs.service == 'frontend' || inputs.service == 'all'
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        if: inputs.service == 'frontend' || inputs.service == 'all'
        working-directory: frontend
        run: npm test

      - name: Run frontend ESLint
        if: inputs.service == 'frontend' || inputs.service == 'all'
        working-directory: frontend
        run: npm run lint

      - name: Build frontend application
        if: inputs.service == 'frontend' || inputs.service == 'all'
        working-directory: frontend
        run: npm run build

      - name: Audit frontend dependencies
        if: inputs.service == 'frontend' || inputs.service == 'all'
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build frontend Docker image
        if: inputs.service == 'frontend' || inputs.service == 'all'
        run: docker build -t analyticore-frontend:${{ github.sha }} frontend

      # =========================================================
      # PYTHON
      # =========================================================

      - name: Configure Python
        if: inputs.service == 'python' || inputs.service == 'all'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python-service/requirements.txt
            python-service/requirements-dev.txt

      - name: Install Python dependencies
        if: inputs.service == 'python' || inputs.service == 'all'
        working-directory: python-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff
        if: inputs.service == 'python' || inputs.service == 'all'
        working-directory: python-service
        run: ruff check app tests

      - name: Run Python tests
        if: inputs.service == 'python' || inputs.service == 'all'
        working-directory: python-service
        run: pytest -v

      - name: Build Python Docker image
        if: inputs.service == 'python' || inputs.service == 'all'
        run: docker build -t analyticore-python:${{ github.sha }} python-service

      # =========================================================
      # JAVA
      # =========================================================

      - name: Configure Java
        if: inputs.service == 'java' || inputs.service == 'all'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Give Maven Wrapper execution permissions
        if: inputs.service == 'java' || inputs.service == 'all'
        working-directory: java-service
        run: chmod +x mvnw

      - name: Run Java tests and package
        if: inputs.service == 'java' || inputs.service == 'all'
        working-directory: java-service
        run: ./mvnw clean verify

      - name: Build Java Docker image
        if: inputs.service == 'java' || inputs.service == 'all'
        run: docker build -t analyticore-java:${{ github.sha }} java-service

      # =========================================================
      # SECURITY
      # =========================================================

      - name: Run Trivy DevSecOps scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: Validation summary
        run: |
          echo "## Production validation passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Selected service: ${{ inputs.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unit tests: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker build: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trivy security scan: passed" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Trigger Render Production deploy
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Production

    steps:
      - name: Deploy Java Production
        if: inputs.service == 'java' || inputs.service == 'all'
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_JAVA_PROD }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Missing RENDER_DEPLOY_HOOK_JAVA_PROD secret"
            exit 1
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --request POST \
            "$DEPLOY_HOOK" > /dev/null

          echo "Java Production deploy requested successfully."

      - name: Deploy Python Production
        if: inputs.service == 'python' || inputs.service == 'all'
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PYTHON_PROD }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Missing RENDER_DEPLOY_HOOK_PYTHON_PROD secret"
            exit 1
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --request POST \
            "$DEPLOY_HOOK" > /dev/null

          echo "Python Production deploy requested successfully."

      - name: Deploy Frontend Production
        if: inputs.service == 'frontend' || inputs.service == 'all'
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND_PROD }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Missing RENDER_DEPLOY_HOOK_FRONTEND_PROD secret"
            exit 1
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --request POST \
            "$DEPLOY_HOOK" > /dev/null

          echo "Frontend Production deploy requested successfully."

      - name: Deployment summary
        run: |
          echo "## Render deployment requested" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Selected service: ${{ inputs.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: Production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Check Render to confirm that each service reaches Live." \
            >> "$GITHUB_STEP_SUMMARY"